# Publishes the site with GitHub Pages on every push to main.
#
# The site is built for its own domain (SITE_ORIGIN in app/src/site/config.ts,
# foolscap.co.in, pointed there from GoDaddy) at its root, with a CNAME file:
# on a branch-published Pages site that file is what claims the domain, so no
# one has to type it into the settings. A domain typed into the settings wins.
# With SITE_ORIGIN null it is built as the preview at
# https://vysakhsuresh.github.io/foolscap/, marked noindex.
#
# GitHub Pages cannot send headers, so every page carries its own policy as
# a <meta> tag (scripts/vite-rebase-html.ts): the strict policy on the tool
# pages, the ad policy on the home page and guides. The unit tests run first:
# a red build never reaches the site.
name: Publish on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck and unit tests
        run: npm run typecheck && npm run test:unit

      - name: Find the domain the site is served at
        id: where
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cname=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            | node -e 'let s="";process.stdin.on("data",(d)=>(s+=d)).on("end",()=>{try{process.stdout.write(JSON.parse(s).cname||"")}catch{}})' || true)
          if [ -z "$cname" ]; then
            cname=$(sed -n "s|^export const SITE_ORIGIN: string \| null = 'https://\([^'/]*\)'.*|\1|p" app/src/site/config.ts)
          fi
          echo "cname=${cname}" >> "$GITHUB_OUTPUT"
          if [ -n "$cname" ]; then echo "Building for https://${cname}/"; else echo "No custom domain yet: building the /foolscap/ preview"; fi

      - name: Build
        run: npm run build
        env:
          FOOLSCAP_HOST: github
          FOOLSCAP_BASE: ${{ steps.where.outputs.cname != '' && '/' || '/foolscap/' }}
          # The real domain only: Google's AdSense tag in the head of the home page and the guides.
          FOOLSCAP_ADS: ${{ steps.where.outputs.cname != '' && '1' || '0' }}

      - name: Publish dist/ to the gh-pages branch
        env:
          CNAME: ${{ steps.where.outputs.cname }}
        run: |
          touch dist/.nojekyll
          if [ -n "$CNAME" ]; then echo "$CNAME" > dist/CNAME; fi
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      # Tells Bing (and the engines that share IndexNow: Yandex, Seznam, Naver)
      # which pages exist, so new and changed pages are found in hours, not
      # weeks. The key is the file app/public/<key>.txt, which proves the site
      # asked. It only names this site's own public pages; nothing about any
      # visitor is involved. A failure here never fails the publish.
      - name: Ask search engines to look at the pages again (IndexNow)
        if: steps.where.outputs.cname != ''
        env:
          CNAME: ${{ steps.where.outputs.cname }}
        run: |
          key=$(ls app/public | sed -n 's/^\([0-9a-f]\{32\}\)\.txt$/\1/p' | head -1)
          if [ -z "$key" ]; then echo "No IndexNow key file"; exit 0; fi
          sleep 60
          node -e '
            const fs = require("fs");
            const [host, key] = process.argv.slice(1);
            const urls = [...fs.readFileSync("dist/sitemap.xml", "utf8").matchAll(/<loc>([^<]+)<\/loc>/g)].map((m) => m[1]);
            const body = JSON.stringify({ host, key, keyLocation: `https://${host}/${key}.txt`, urlList: urls });
            fetch("https://api.indexnow.org/indexnow", { method: "POST", headers: { "Content-Type": "application/json; charset=utf-8" }, body })
              .then((r) => console.log(`IndexNow: ${r.status} for ${urls.length} pages`))
              .catch((e) => console.log(`IndexNow failed: ${e.message}`));
          ' "$CNAME" "$key" || true
