<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Merge PDF — Foolscap</title>
  <meta name="description" content="Join several PDFs into one, in the order you choose. In your browser; nothing is uploaded. Free, no sign-up, no limits, no watermark.">
  <meta name="theme-color" content="#fbf6ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17161f" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Merge PDF — Foolscap">
  <meta property="og:description" content="Join several PDFs into one, in the order you choose. In your browser; nothing is uploaded. Free, no sign-up, no limits, no watermark.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <script type="module" src="/src/pages/tool.ts"></script>
</head>
<body data-tool="merge" data-page="tool">
  <header class="site-header" data-testid="site-header">
    <div class="wrap site-header__row">
      <a class="brand" href="/"><svg class="mark" data-testid="mark" viewBox="0 0 64 64" width="36" height="36" aria-hidden="true" focusable="false"><path d="M17 21h24l9 9v27a3 3 0 0 1-3 3H17a3 3 0 0 1-3-3V24a3 3 0 0 1 3-3Z" fill="var(--surface)" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M41 21v9h9Z" fill="var(--highlighter)" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M22 40h18M22 47h22M22 54h12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M14 21.5C13 17 10 13 6 9c7 1 12 4 16 8 1-5 3-9 5-13 2 4 4 8 5 13 4-4 10-7 16-8-4 4-7 8-8 12.5Z" fill="var(--highlighter)" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><circle cx="6" cy="9" r="2.8" fill="currentColor"/><circle cx="27" cy="4" r="2.8" fill="currentColor"/><circle cx="48" cy="9" r="2.8" fill="currentColor"/></svg><span>Foolscap</span></a>
      <nav class="site-nav" data-testid="site-nav" aria-label="Site">
        <a href="/#tools" aria-current="page">Tools</a>
        <a href="/private/">Nothing leaves</a>
      </nav>
    </div>
  </header>
  <main class="wrap tool" data-app>
    <header class="tool__head">
      <h1 class="tool__title" data-testid="tool-title">Merge</h1>
      <p class="tool__summary">Join several PDFs into one, in the order you choose. Nothing is uploaded: the work happens on this device.</p>
    </header>
    <label class="drop-zone" data-testid="drop-zone" for="file-input" tabindex="0" role="button" aria-describedby="drop-hint">
      <svg class="drop-zone__icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path d="M12 8h16l8 8v22a2 2 0 0 1-2 2H12a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M28 8v8h8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M24 22v12m-5-5 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="drop-zone__title">Drop your PDFs here, or tap to pick them</span>
      <span class="drop-zone__hint" id="drop-hint">They stay on this device. No size limit.</span>
      <input class="visually-hidden" id="file-input" data-testid="file-input" type="file" accept="application/pdf,.pdf" multiple tabindex="-1">
    </label>
    <div data-slot="body"></div>
  </main>
  <footer class="site-footer" data-testid="site-footer">
    <div class="wrap site-footer__row">
      <p>From <a href="https://layerbit.co.in" rel="noopener">Layerbit</a></p>
      <p class="site-footer__links"><a href="/private/">How nothing leaves your device</a><span data-feedback></span></p>
    </div>
  </footer>
</body>
</html>
